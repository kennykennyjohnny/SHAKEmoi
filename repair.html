<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAKEMOI - Réparation Profil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .repair-card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #667eea;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
    }
    .status.info { background: #e3f2fd; color: #1976d2; }
    .status.success { background: #e8f5e9; color: #388e3c; }
    .status.error { background: #ffebee; color: #d32f2f; }
    .status.warning { background: #fff3e0; color: #f57c00; }
    button {
      width: 100%;
      padding: 15px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .log {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="repair-card">
    <h1>🔧 Réparation Profil</h1>
    <p>Cet outil va réparer ton profil SHAKEmoi sans créer un nouveau compte.</p>

    <div id="status" class="status info">
      Clique sur "Réparer" pour commencer...
    </div>

    <button id="repairBtn" onclick="repairProfile()">🔧 Réparer mon profil</button>
    <button onclick="window.location.href='index.html'" style="background: #666; margin-top: 10px;">← Retour</button>

    <div id="log" class="log" style="display: none;"></div>
  </div>

  <script src="scripts/config.js"></script>
  <script>
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const repairBtn = document.getElementById('repairBtn');

    function log(msg, emoji = '•') {
      console.log(msg);
      logDiv.style.display = 'block';
      logDiv.innerHTML += `${emoji} ${msg}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setStatus(msg, type) {
      statusDiv.className = `status ${type}`;
      statusDiv.textContent = msg;
    }

    async function repairProfile() {
      repairBtn.disabled = true;
      logDiv.innerHTML = '';
      log('Début de la réparation...', '🔧');

      try {
        // 1. Vérifier la session
        log('Vérification de la session...', '🔍');
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
          setStatus('❌ Pas de session active. Connecte-toi d\'abord.', 'error');
          log('Pas de session trouvée', '❌');
          repairBtn.disabled = false;
          return;
        }

        log(`Session trouvée pour: ${session.user.email}`, '✅');
        const userId = session.user.id;

        // 2. Vérifier si le profil existe déjà
        log('Vérification du profil...', '🔍');
        const { data: existingProfile, error: checkError } = await supabase
          .from('users_profile')
          .select('*')
          .eq('id', userId)
          .maybeSingle();

        if (checkError) {
          log(`Erreur lors de la vérification: ${checkError.message}`, '❌');
          throw checkError;
        }

        if (existingProfile) {
          setStatus('✅ Profil déjà existant ! Aucune réparation nécessaire.', 'success');
          log(`Profil trouvé: @${existingProfile.username}`, '✅');
          log('Redirection vers l\'app dans 3 secondes...', '➡️');
          setTimeout(() => {
            window.location.href = 'app.html';
          }, 3000);
          return;
        }

        log('Profil manquant, création en cours...', '⚠️');

        // 3. Générer un username depuis l'email
        const emailUsername = session.user.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '');
        const randomNum = Math.floor(Math.random() * 1000);
        const username = `${emailUsername}${randomNum}`;
        const randomColor = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A8E6CF', '#FF8B94', '#B4A7D6'][Math.floor(Math.random() * 6)];

        log(`Username généré: @${username}`, '👤');
        log(`Couleur: ${randomColor}`, '🎨');

        // 4. Créer le profil
        log('Création du profil...', '💾');
        const { data: newProfile, error: createError } = await supabase
          .from('users_profile')
          .insert([{
            id: userId,
            username: username,
            email: session.user.email,
            color: randomColor,
            feels_count: 0,
            feelings_count: 0
          }])
          .select()
          .single();

        if (createError) {
          log(`Erreur lors de la création: ${createError.message}`, '❌');
          throw createError;
        }

        log('Profil créé avec succès !', '✅');
        log(`Ton username: @${newProfile.username}`, '🎵');

        setStatus(`✅ Profil réparé ! Username: @${newProfile.username}`, 'success');

        // 5. Rediriger vers l'app
        log('Redirection vers l\'app dans 3 secondes...', '➡️');
        setTimeout(() => {
          sessionStorage.clear();
          window.location.href = 'app.html';
        }, 3000);

      } catch (error) {
        console.error('Erreur:', error);
        log(`ERREUR: ${error.message}`, '❌');
        setStatus(`❌ Erreur: ${error.message}`, 'error');
        repairBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
