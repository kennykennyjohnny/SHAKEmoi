<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SHAKEMOI - Partage ta passion pour la musique">
  <meta name="theme-color" content="#0a0a0f">
  <title>SHAKEMOI - Partage ta musique</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <!-- PAGE D'AUTHENTIFICATION -->
    <div id="auth-page" class="auth-page">
      <div class="auth-logo">SHAKEMOI</div>

      <div class="auth-container">
        <!-- Toggle Login/Signup -->
        <div class="auth-toggle">
          <button id="btn-show-login" class="active">Login</button>
          <button id="btn-show-signup">Signup</button>
        </div>

        <!-- Formulaire Login -->
        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="ton@email.com" required>
          </div>

          <div class="form-group">
            <label for="login-password">Mot de passe</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>

          <div id="login-error" class="error-message hidden"></div>

          <button type="submit" class="btn-primary">Se connecter</button>
        </form>

        <!-- Formulaire Signup -->
        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label for="signup-username">Nom d'utilisateur</label>
            <input type="text" id="signup-username" placeholder="ton_username" required>
          </div>

          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" placeholder="ton@email.com" required>
          </div>

          <div class="form-group">
            <label for="signup-password">Mot de passe</label>
            <input type="password" id="signup-password" placeholder="••••••••" required minlength="6">
          </div>

          <div class="form-group">
            <label>Choisis ta couleur</label>
            <div class="color-picker">
              <div class="color-option" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
              <div class="color-option" data-color="#4ECDC4" style="background-color: #4ECDC4;"></div>
              <div class="color-option" data-color="#FFE66D" style="background-color: #FFE66D;"></div>
              <div class="color-option" data-color="#A8E6CF" style="background-color: #A8E6CF;"></div>
              <div class="color-option" data-color="#FF8B94" style="background-color: #FF8B94;"></div>
              <div class="color-option" data-color="#B4A7D6" style="background-color: #B4A7D6;"></div>
            </div>
          </div>

          <div id="signup-error" class="error-message hidden"></div>

          <button type="submit" class="btn-primary">S'inscrire</button>
        </form>
      </div>
    </div>

    <!-- APPLICATION PRINCIPALE -->
    <div id="app-container" class="app-container">
      <!-- SECTION 1 : SHAKE (FEED) -->
      <section id="section-shake" class="app-section active">
        <!-- Bulles découvertes (optionnel - peut être ajouté plus tard) -->
        <!-- <div class="discovery-bubbles">
          <div class="discovery-bubble">
            <div class="bubble-image"><img src="" alt=""></div>
            <div class="bubble-name">Username</div>
          </div>
        </div> -->

        <!-- Feed des posts -->
        <div id="feed-container" class="feed-container">
          <!-- Posts générés dynamiquement -->
        </div>
      </section>

      <!-- SECTION 2 : TOP (TOP 100) -->
      <section id="section-top" class="app-section">
        <h2 class="text-center mb-lg" style="font-size: var(--font-size-2xl); font-weight: bold; color: var(--color-primary);">
          Top 100 Last.fm
        </h2>
        <div id="top-container" class="top-list">
          <!-- Top tracks générés dynamiquement -->
        </div>
      </section>

      <!-- SECTION 3 : RECHERCHE -->
      <section id="section-search" class="app-section">
        <div class="search-bar">
          <div class="search-input-wrapper">
            <input type="text" id="search-input" class="search-input" placeholder="Rechercher...">
          </div>

          <div class="search-toggle">
            <button id="search-toggle-people" class="active">Personnes</button>
            <button id="search-toggle-sounds">Sons</button>
          </div>
        </div>

        <div id="search-results" class="search-results">
          <!-- Résultats générés dynamiquement -->
        </div>
      </section>

      <!-- SECTION 4 : PROFIL -->
      <section id="section-profile" class="app-section">
        <div class="profile-header">
          <div id="profile-note" class="profile-note">🎵</div>
          <div id="profile-username" class="profile-username">Username</div>

          <div class="profile-stats">
            <div class="stat-item">
              <div id="profile-feels" class="stat-value">0</div>
              <div class="stat-label">Feels</div>
            </div>
            <div class="stat-item">
              <div id="profile-feelings" class="stat-value">0</div>
              <div class="stat-label">Feelings</div>
            </div>
          </div>

          <button id="btn-logout" class="btn-logout">Déconnexion</button>
        </div>

        <div class="profile-toggle">
          <button id="profile-toggle-shakes" class="active">Shakes</button>
          <button id="profile-toggle-comments">Commentaires</button>
        </div>

        <div id="profile-content">
          <!-- Contenu profil généré dynamiquement -->
        </div>
      </section>

      <!-- NAVIGATION BOTTOM -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-section="shake">
          <span style="font-size: 1.5rem;">🎵</span>
          <span>SHAKE</span>
        </button>
        <button class="nav-btn" data-section="top">
          <span style="font-size: 1.5rem;">🔥</span>
          <span>TOP</span>
        </button>
        <button class="nav-btn" data-section="search">
          <span style="font-size: 1.5rem;">🔍</span>
          <span>SEARCH</span>
        </button>
        <button class="nav-btn" data-section="profile">
          <span style="font-size: 1.5rem;">👤</span>
          <span>PROFILE</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/top.js"></script>
  <script src="js/search.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
