<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SHAKEMOI - L'app que tu ouvres avant Spotify">
  <meta name="theme-color" content="#7c3aed">
  <title>SHAKEMOI</title>
  <link rel="stylesheet" href="styles/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-wrapper">
    <div class="app-container">

      <!-- Header -->
      <header class="app-header">
        <h1 class="logo">SHAKEMOI</h1>
        <button class="logout-btn" id="logout-btn">
          <span>Déconnexion</span>
        </button>
      </header>

      <!-- Main Content -->
      <main class="main-content">

        <!-- View 1: Shake (Feed) -->
        <div id="shake-view" class="view active">
          <div class="view-header">
            <h2>Feed</h2>
          </div>
          <div id="feed-container" class="feed-container">
            <div class="loading">
              <div class="spinner"></div>
              <p>Chargement du feed...</p>
            </div>
          </div>
        </div>

        <!-- View 2: TOP (Top 100) -->
        <div id="top-view" class="view">
          <div class="view-header">
            <h2>Top 100</h2>
            <p class="subtitle">Les morceaux les plus écoutés du moment</p>
          </div>
          <div id="top-container" class="top-container">
            <div class="loading">
              <div class="spinner"></div>
              <p>Chargement du Top 100...</p>
            </div>
          </div>
        </div>

        <!-- View 3: Recherche -->
        <div id="search-view" class="view">
          <div class="search-header">
            <input type="text" id="search-input" class="search-input" placeholder="Rechercher...">

            <div class="search-toggle">
              <button class="toggle-btn active" data-mode="tracks">Sons</button>
              <button class="toggle-btn" data-mode="users">Personnes</button>
            </div>
          </div>

          <div id="search-results" class="search-results">
            <div class="empty-state">
              <p>Tape quelque chose pour rechercher</p>
            </div>
          </div>
        </div>

        <!-- View 4: Profil -->
        <div id="profile-view" class="view">
          <div class="profile-header">
            <!-- Note musicale colorée -->
            <div class="music-note" id="user-note">♪</div>
            <h2 class="username" id="user-username">@username</h2>

            <div class="stats">
              <div class="stat">
                <span class="stat-value" id="feels-count">0</span>
                <span class="stat-label">Feels</span>
              </div>
              <div class="stat">
                <span class="stat-value" id="feelings-count">0</span>
                <span class="stat-label">Feelings</span>
              </div>
            </div>
          </div>

          <div class="profile-tabs">
            <button class="tab-btn active" data-tab="shakes">Shakes</button>
            <button class="tab-btn" data-tab="comments">Commentaires</button>
          </div>

          <div id="profile-content" class="profile-content">
            <div class="loading">
              <div class="spinner"></div>
              <p>Chargement...</p>
            </div>
          </div>
        </div>

      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-view="shake">
          <span class="nav-icon">🎵</span>
          <span class="nav-label">Shake</span>
        </button>
        <button class="nav-btn" data-view="top">
          <span class="nav-icon">🔥</span>
          <span class="nav-label">TOP</span>
        </button>
        <button class="nav-btn" data-view="search">
          <span class="nav-icon">🔍</span>
          <span class="nav-label">Recherche</span>
        </button>
        <button class="nav-btn" data-view="profile">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Profil</span>
        </button>
      </nav>

    </div>
  </div>

  <!-- Modal pour commenter -->
  <div id="comment-modal" class="modal">
    <div class="modal-content">
      <h3>Ajouter un commentaire</h3>
      <textarea id="comment-text" placeholder="Ton commentaire..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-comment">Annuler</button>
        <button class="btn-primary" id="submit-comment">Publier</button>
      </div>
    </div>
  </div>

  <!-- Modal pour shake avec texte -->
  <div id="shake-modal" class="modal">
    <div class="modal-content">
      <h3>Shake ce morceau</h3>
      <div id="shake-track-info"></div>
      <textarea id="shake-text" placeholder="Ajoute un commentaire (optionnel)..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-shake">Annuler</button>
        <button class="btn-primary" id="submit-shake">Shake !</button>
      </div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/database.js"></script>
  <script src="scripts/lastfm.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
