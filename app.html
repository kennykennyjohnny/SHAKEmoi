<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SHAKEMOI - L'app que tu ouvres avant Spotify">
  <meta name="theme-color" content="#FF6F61">
  <title>SHAKEMOI</title>
  <!-- Variables de couleur -->
  <link rel="stylesheet" href="styles/color-scheme.css">
  <!-- Styles de base -->
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/enhancements.css">
  <link rel="stylesheet" href="styles/v3-features.css">
  <link rel="stylesheet" href="styles/modern-layout.css">
  <link rel="stylesheet" href="styles/ultra-modern.css">
  <link rel="stylesheet" href="styles/header-navbar-modern.css">
  <link rel="stylesheet" href="styles/coral-theme.css">
  <link rel="stylesheet" href="styles/feed-compact.css">
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
</head>
<body>
  <div class="app-wrapper">
    <div class="app-container">

      <!-- Header -->
      <header class="app-header">
        <h1 class="logo">SHAKE<span class="logo-moi">moi</span></h1>
        <div class="header-actions">
          <!-- Bouton notifications avec pastille -->
          <button class="notif-btn" onclick="toggleNotifMenu()" title="Notifications">
            <svg class="notif-icon" viewBox="0 0 24 24">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
            </svg>
            <!-- Pastille si notifications non lues -->
            <span class="notif-badge" id="notif-badge" style="display: none;"></span>
          </button>
          <!-- Bouton logout -->
          <button class="notif-btn" id="logout-btn" title="Déconnexion">
            <svg class="notif-icon" viewBox="0 0 24 24">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">

        <!-- View 1: Shake (Feed) -->
        <div id="shake-view" class="view active">
          <div id="feed-container" class="feed-container">
            <div class="loading">
              <div class="spinner"></div>
              <p>Chargement du feed...</p>
            </div>
          </div>
        </div>

        <!-- View 2: TOP (Top 100) -->
        <div id="top-view" class="view">
          <div class="view-header">
            <h2>Top 100</h2>
            <p class="subtitle">Les morceaux les plus écoutés du moment</p>
          </div>
          <div id="top-container" class="top-container">
            <div class="loading">
              <div class="spinner"></div>
              <p>Chargement du Top 100...</p>
            </div>
          </div>
        </div>

        <!-- View 3: Recherche -->
        <div id="search-view" class="view">
          <div class="search-header">
            <input type="text" id="search-input" class="search-input" placeholder="Rechercher...">

            <div class="search-toggle">
              <button class="toggle-btn active" data-mode="tracks">Sons</button>
              <button class="toggle-btn" data-mode="users">Personnes</button>
            </div>
          </div>

          <div id="search-results" class="search-results">
            <div class="empty-state">
              <p>Tape quelque chose pour rechercher</p>
            </div>
          </div>
        </div>

        <!-- View 4: Profil -->
        <div id="profile-view" class="view">
          <div class="profile-header">
            <!-- Note musicale colorée -->
            <div class="music-note" id="user-note">♪</div>
            <h2 class="username" id="user-username">@username</h2>

            <div class="stats">
              <div class="stat">
                <span class="stat-value" id="feels-count">0</span>
                <span class="stat-label">Shakeurs</span>
              </div>
            </div>
          </div>

          <div class="profile-tabs">
            <button class="tab-btn active" data-tab="shakes">♫ Shakes</button>
            <button class="tab-btn" data-tab="reshakes">↻ Re-Shakes</button>
          </div>

          <div id="profile-content" class="profile-content">
            <div class="loading">
              <div class="spinner"></div>
              <p>Chargement...</p>
            </div>
          </div>
        </div>

      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-view="shake">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="nav-label">Shake</span>
        </button>
        <button class="nav-btn" data-view="top">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>
          </svg>
          <span class="nav-label">TOP</span>
        </button>
        <button class="nav-btn" data-view="search">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <span class="nav-label">Recherche</span>
        </button>
        <button class="nav-btn" data-view="profile">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
          <span class="nav-label">Profil</span>
        </button>
      </nav>

    </div>
  </div>

  <!-- Menu notifications (masqué par défaut) -->
  <div class="notif-menu" id="notif-menu" style="display: none;">
    <div class="notif-header">
      <h3>Notifications</h3>
      <button class="btn-close" onclick="toggleNotifMenu()">✕</button>
    </div>
    <div class="notif-list" id="notif-list">
      <div class="loading">
        <div class="spinner"></div>
        <p>Chargement...</p>
      </div>
    </div>
  </div>

  <!-- Modal pour commenter -->
  <div id="comment-modal" class="modal">
    <div class="modal-content">
      <h3>Ajouter un commentaire</h3>
      <textarea id="comment-text" placeholder="Ton commentaire..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-comment">Annuler</button>
        <button class="btn-primary" id="submit-comment">Publier</button>
      </div>
    </div>
  </div>

  <!-- Modal pour shake avec texte -->
  <div id="shake-modal" class="modal">
    <div class="modal-content">
      <h3>Shake ce morceau</h3>
      <div id="shake-track-info"></div>
      <textarea id="shake-text" placeholder="Ajoute un commentaire (optionnel)..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-shake">Annuler</button>
        <button class="btn-primary" id="submit-shake">Shake !</button>
      </div>
    </div>
  </div>

  <!-- Modal pour profil utilisateur -->
  <div id="user-profile-modal" class="modal">
    <div class="modal-content user-profile-modal">
      <button class="modal-close" onclick="closeUserProfile()">✕</button>
      <div class="profile-header">
        <div class="music-note" id="modal-user-note">♪</div>
        <h2 class="username" id="modal-user-username">@username</h2>
        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="modal-feels-count">0</span>
            <span class="stat-label">Shakeurs</span>
          </div>
        </div>
        <button class="btn-follow modal-follow-btn" id="modal-follow-btn">Feel</button>
      </div>
      <div class="profile-tabs">
        <button class="tab-btn active" data-tab="shakes">Shakes</button>
      </div>
      <div id="modal-profile-content" class="profile-content">
        <div class="loading">
          <div class="spinner"></div>
          <p>Chargement...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/database.js"></script>
  <script src="scripts/spotify.js"></script>
  <script src="scripts/lastfm.js"></script>
  <script src="scripts/notifications.js"></script>
  <script src="scripts/emojis.js"></script>
  <script src="scripts/v3-features.js"></script>
  <!-- App principal en dernier -->
  <script src="scripts/app.js"></script>
</body>
</html>
