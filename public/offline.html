<!DOCTYPE html>
<html lang="fr">
<head>

  <title>SHAKEmoi · Hors connexion</title>

      border: 0; border-radius: 14px; padding: 12px 22px; font-weight: 700; font-size: 14px; color: #fff;

  <main>
    <img src="/icon-192.png" alt="SHAKEmoi" />
