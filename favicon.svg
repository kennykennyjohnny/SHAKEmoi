<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Dégradé de fond violet-corail -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF5BC6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <!-- Dégradé du S en corail -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8E80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7668;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E80;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi avec dégradé violet-corail -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Formes d'onde stylisées en arrière-plan (notes musicales abstraites) -->
  <rect x="15" y="55" width="8" height="30" rx="4" fill="rgba(255,142,128,0.15)"/>
  <rect x="27" y="45" width="8" height="40" rx="4" fill="rgba(255,142,128,0.2)"/>
  <rect x="39" y="50" width="8" height="35" rx="4" fill="rgba(255,142,128,0.15)"/>

  <!-- S stylisé en corail -->
  <text x="50" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" fill="url(#sGrad)" text-anchor="middle" letter-spacing="-2">S</text>

  <!-- Petit effet de brillance -->
  <circle cx="30" cy="30" r="8" fill="rgba(255,255,255,0.2)"/>
</svg>
